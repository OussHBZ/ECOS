{% extends 'kine_base.html' %}{% block content %}
<h1>Seuils de réussite</h1><p>Les changements s’appliquent aux nouvelles tentatives. Le seuil déjà figé d’une tentative reste inchangé.</p>
<form method="post" class="kine-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% for level,label in [('licence','Licence'),('master','Master')] %}<label>{{ label }} (/20)<input name="{{ level }}" type="number" min="0" max="20" step="any" value="{{ values[level] }}" required></label>{% endfor %}<button class="btn btn-primary">Enregistrer</button></form>
{% endblock %}
