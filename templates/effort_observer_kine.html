{% extends 'kine_base.html' %}
{% block title %}Mesures de l’observateur{% endblock %}
{% block content %}<section class="kine-card"><h1>Mesures de l’enseignant / observateur</h1><form data-observer-form data-url="{{ url_for('kine.teacher_effort_measurement', session_id=simulation.id) }}"><label>Test / paramètre / moment<select name="measurement">{% for row in measurements %}<option value='{{ {"test_id":row.test_id,"measurement_id":row.id}|tojson }}'>{{ row.test_name }} · {{ row.name }} · {{ row.moment }} {{ row.moment_detail or '' }}</option>{% endfor %}</select></label><label>Valeur observée<input name="observed_value" required maxlength="1200"></label><button class="btn btn-primary" {% if simulation.status != 'in_progress' or not measurements %}disabled{% endif %}>Enregistrer l’observation</button><p role="status" data-observer-status></p></form></section>{% endblock %}
{% block kine_scripts %}<script src="{{ url_for('static', filename='js/kine-observer.js') }}" defer></script>{% endblock %}
