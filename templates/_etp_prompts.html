<h3>Paroles du patient prévues dans le scénario ETP</h3><p>Renseignez uniquement les questions, préoccupations, croyances ou reformulations validées pour le patient. Les réponses attendues restent dans les catégories de référence.</p>
{% for prompt in content.get('patient_prompts',[]) + [{}] %}<fieldset class="kine-form-grid"><label>Catégorie<select name="prompt_category">{% for key,label in categories.items() %}<option value="{{ key }}" {% if prompt.get('category') == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Mots déclencheurs de l’étudiant<input name="prompt_trigger" value="{{ prompt.get('trigger','') }}"></label><label>Paroles exactes du patient<textarea name="prompt_text">{{ prompt.get('text','') }}</textarea></label><label>Niveau<select name="prompt_level"><option value="both">Licence et Master</option><option value="master" {% if prompt.get('master_only') %}selected{% endif %}>Master uniquement</option></select></label><input type="hidden" name="prompt_id" value="{{ prompt.get('id','') }}"></fieldset>{% endfor %}
